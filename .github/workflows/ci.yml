name: Build and regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake gcc clang python3
      - run: autoreconf -fi && ./configure CC=${{ matrix.compiler }} CFLAGS='-O2 -g -Wall -Wextra' && make
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
        env:
          CC: ${{ matrix.compiler }}
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
        env:
          CC: ${{ matrix.compiler }}
          SANITIZE: '1'
          RELAY_TEST_CFLAGS: '-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie'
          ASAN_OPTIONS: detect_leaks=1
